<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MORANFLIX • 40th Birthday Special</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #141414;
      --card-bg: #1f1f1f;
      --netflix-red: #e50914;
      --netflix-red-dark: #b20710;
      --netflix-red-hover: #f40612;
      --text-main: #ffffff;
      --text-muted: #a3a3a3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================================
       CINEMATIC INTRO OVERLAY (M -> MORANFLIX)
       ========================================= */
    #intro-screen {
      position: fixed;
      inset: 0;
      background-color: #000000;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #intro-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #start-experience-btn {
      background: transparent;
      border: 2px solid rgba(229, 9, 20, 0.8);
      color: #fff;
      padding: 1rem 2.6rem;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 4px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(229, 9, 20, 0.35);
      transition: transform 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
    }

    #start-experience-btn:hover {
      background-color: var(--netflix-red);
      transform: scale(1.06);
      box-shadow: 0 0 40px rgba(229, 9, 20, 0.75);
    }

    #logo-animation-stage {
      display: none;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
      height: 100%;
    }

    #logo-animation-stage.playing {
      display: flex;
    }

    .netflix-wordmark {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(4.5rem, 13vw, 10rem);
      font-weight: 900;
      color: var(--netflix-red);
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 6px;
      text-shadow: 0 10px 30px rgba(229, 9, 20, 0.45);
      user-select: none;
      animation: wordmarkExit 0.65s ease-in 2.65s forwards;
    }

    .letter-m {
      display: inline-block;
      position: relative;
      transform-origin: center center;
      animation: mPopAndSettle 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      text-shadow:
        -3px 0 0 var(--netflix-red-dark),
        0 12px 35px rgba(229, 9, 20, 0.75);
    }

    .letters-rest {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      max-width: 0;
      opacity: 0;
      animation: revealRest 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.95s forwards;
    }

    .light-sweep {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(229, 9, 20, 0.22) 0%, transparent 65%);
      opacity: 0;
      pointer-events: none;
      animation: glowPulse 3.2s ease-out forwards;
    }

    .skip-intro-btn {
      position: absolute;
      bottom: 2.2rem;
      right: 2.5rem;
      background: rgba(20, 20, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #e5e5e5;
      padding: 0.55rem 1.2rem;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .skip-intro-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: #fff;
      color: #fff;
    }

    @keyframes mPopAndSettle {
      0% { transform: scale(0.35); opacity: 0; filter: brightness(1.6); }
      45% { transform: scale(1.25); opacity: 1; filter: brightness(1.3); }
      100% { transform: scale(1); opacity: 1; filter: brightness(1); }
    }

    @keyframes wordmarkExit {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.12); opacity: 0; }
    }

    @keyframes revealRest {
      0% { max-width: 0; opacity: 0; transform: translateX(-18px); }
      30% { opacity: 1; }
      100% { max-width: 900px; opacity: 1; transform: translateX(0); }
    }

    @keyframes glowPulse {
      0% { opacity: 0; transform: scale(0.6); }
      25% { opacity: 1; transform: scale(1.1); }
      80% { opacity: 0.7; transform: scale(1.3); }
      100% { opacity: 0; transform: scale(1.5); }
    }

    /* =========================================
       WHO'S WATCHING OVERLAY
       ========================================= */
    #profile-gate {
      position: fixed;
      inset: 0;
      background-color: var(--bg-color);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #profile-gate.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .gate-title {
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 500;
      margin-bottom: 2.5rem;
    }

    .profiles-grid {
      display: flex;
      gap: 2.5rem;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 1.5rem;
    }

    .profile-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .profile-avatar {
      width: 165px;
      height: 165px;
      border-radius: 8px;
      object-fit: cover;
      object-position: center 20%;
      border: 3px solid transparent;
      transition: transform 0.25s ease, border-color 0.25s ease;
      background-color: #333;
    }

    .profile-card:hover .profile-avatar {
      border-color: #fff;
      transform: scale(1.06);
    }

    .default-avatar-box {
      width: 165px;
      height: 165px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
      border: 3px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .profile-card:hover .default-avatar-box {
      border-color: #fff;
      transform: scale(1.06);
    }

    .profile-name {
      margin-top: 1rem;
      font-size: 1.35rem;
      color: var(--text-muted);
      transition: color 0.25s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .profile-card:hover .profile-name {
      color: #fff;
    }

    .profile-lock-icon {
      font-size: 0.95rem;
      opacity: 0.8;
    }

    /* =========================================
       PASSWORD / PIN MODAL & LOCK NOTICE MODAL
       ========================================= */
    .auth-modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 2800;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .auth-modal-backdrop.open {
      display: flex;
    }

    .auth-dialog {
      background-color: #181818;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 2.2rem 2rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95);
    }

    .auth-dialog-icon {
      font-size: 2.2rem;
      margin-bottom: 0.6rem;
    }

    .auth-dialog-title {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .auth-dialog-sub {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.4rem;
      line-height: 1.4;
    }

    .pin-input {
      width: 100%;
      background: #262626;
      border: 2px solid #444;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
      font-size: 1.5rem;
      letter-spacing: 6px;
      text-align: center;
      padding: 0.7rem 1rem;
      margin-bottom: 0.75rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .pin-input:focus {
      border-color: var(--netflix-red);
    }

    .pin-error {
      color: var(--netflix-red);
      font-size: 0.88rem;
      font-weight: 600;
      min-height: 1.25rem;
      margin-bottom: 1rem;
    }

    .auth-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
    }

    .btn-auth-primary {
      flex: 1;
      background: var(--netflix-red);
      border: none;
      color: #fff;
      padding: 0.7rem 1.2rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-auth-primary:hover {
      background: var(--netflix-red-hover);
    }

    .btn-auth-secondary {
      flex: 1;
      background: #2b2b2b;
      border: 1px solid #555;
      color: #e5e5e5;
      padding: 0.7rem 1.2rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-auth-secondary:hover {
      background: #3d3d3d;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .shake {
      animation: shake 0.35s ease;
    }

    /* =========================================
       MAIN APP UI
       ========================================= */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 1rem 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85) 10%, rgba(0,0,0,0));
      transition: background-color 0.3s ease;
    }

    header.scrolled {
      background-color: #141414;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--netflix-red);
      font-size: 2.3rem;
      letter-spacing: 3px;
      cursor: pointer;
      user-select: none;
    }

    .nav-tags {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .nav-tag-btn {
      background: none;
      border: none;
      color: #e5e5e5;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-tag-btn:hover, .nav-tag-btn.active {
      color: #fff;
      font-weight: 700;
    }

    /* Top-Right Switch Profile Button */
    .switch-profile-btn {
      background: rgba(20, 20, 20, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 6px;
      padding: 0.3rem 0.6rem 0.3rem 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s, transform 0.2s;
    }

    .switch-profile-btn:hover {
      background: rgba(45, 45, 45, 0.9);
      border-color: #fff;
    }

    .nav-avatar-thumb {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      object-fit: cover;
      object-position: center 20%;
      display: block;
    }

    .nav-avatar-default {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .switch-caret {
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: transform 0.2s, color 0.2s;
    }

    .switch-profile-btn:hover .switch-caret {
      color: #fff;
      transform: translateY(1px);
    }

    /* Hero Banner */
    .hero {
      position: relative;
      height: 78vh;
      min-height: 500px;
      display: flex;
      align-items: center;
      padding: 0 4%;
      background-size: cover;
      background-position: center 25%;
      background-color: #222;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--bg-color) 8%, rgba(20,20,20,0.4) 50%, rgba(20,20,20,0.7) 100%),
                  linear-gradient(to right, rgba(20,20,20,0.85) 15%, rgba(20,20,20,0) 70%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 600px;
      margin-top: 4rem;
    }

    .hero-badge {
      display: inline-block;
      color: var(--netflix-red);
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
      font-size: 1rem;
      text-transform: uppercase;
    }

    .hero-title {
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 0.8rem;
    }

    .hero-meta {
      color: #46d369;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .hero-desc {
      font-size: 1.1rem;
      line-height: 1.5;
      color: #e5e5e5;
      margin-bottom: 1.8rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    .hero-buttons {
      display: flex;
      gap: 1rem;
    }

    .btn-play {
      background-color: #fff;
      color: #000;
      border: none;
      padding: 0.75rem 2rem;
      font-size: 1.15rem;
      font-weight: 700;
      font-family: inherit;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: background-color 0.2s;
    }

    .btn-play:hover {
      background-color: rgba(255,255,255,0.75);
    }

    /* Rows Container */
    main {
      position: relative;
      z-index: 5;
      margin-top: -60px;
      padding-bottom: 4rem;
    }

    .row {
      margin-bottom: 2.5rem;
      padding: 0 4%;
      position: relative;
    }

    .row-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
      color: #e5e5e5;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .row-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .row-scroller {
      display: flex;
      gap: 0.8rem;
      overflow-x: auto;
      padding: 0.8rem 0 1.2rem 0;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.25) transparent;
      width: 100%;
    }

    .row-scroller::-webkit-scrollbar {
      height: 6px;
    }

    .row-scroller::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 3px;
    }

    .row-scroller.grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
      overflow-x: visible;
    }

    .row-scroller.grid-view .clip-card {
      flex: unset;
      width: 100%;
    }

    .scroll-arrow {
      position: absolute;
      top: 0.8rem;
      bottom: 1.2rem;
      width: 44px;
      background: rgba(20, 20, 20, 0.72);
      border: none;
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      cursor: pointer;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease, background-color 0.2s ease;
    }

    .row-wrapper:hover .scroll-arrow {
      opacity: 1;
    }

    .scroll-arrow:hover {
      background: rgba(20, 20, 20, 0.92);
      color: var(--netflix-red);
    }

    .scroll-arrow.left {
      left: -10px;
      border-radius: 0 6px 6px 0;
    }

    .scroll-arrow.right {
      right: -10px;
      border-radius: 6px 0 0 6px;
    }

    /* Clip / Series Card */
    .clip-card {
      flex: 0 0 280px;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #262626 0%, #161616 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .clip-card:hover {
      transform: scale(1.08);
      z-index: 10;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    }

    .clip-card.locked-card {
      background: repeating-linear-gradient(
        135deg,
        #1e1e1e,
        #1e1e1e 12px,
        #161616 12px,
        #161616 24px
      );
      border-color: rgba(229, 9, 20, 0.28);
    }

    .clip-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .series-badge {
      position: absolute;
      top: 0.65rem;
      left: 0.65rem;
      background: rgba(229, 9, 20, 0.92);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 0.22rem 0.55rem;
      border-radius: 3px;
      text-transform: uppercase;
      z-index: 3;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }

    .locked-pill {
      position: absolute;
      top: 0.65rem;
      right: 0.65rem;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #e5e5e5;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      text-transform: uppercase;
      z-index: 3;
    }

    .clip-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.92) 10%, rgba(0,0,0,0.2) 60%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0.9rem;
    }

    .clip-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
    }

    .clip-sub {
      font-size: 0.85rem;
      color: #46d369;
      font-weight: 500;
    }

    .locked-card .clip-sub {
      color: var(--netflix-red);
    }

    .clip-tags {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .play-icon-badge {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      width: 48px;
      height: 48px;
      background: rgba(0,0,0,0.65);
      border: 2px solid #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      font-size: 1.2rem;
      padding-left: 3px;
    }

    .clip-card:hover .play-icon-badge {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .locked-card .play-icon-badge {
      opacity: 0.85;
      padding-left: 0;
      border-color: rgba(255, 255, 255, 0.55);
      font-size: 1.15rem;
    }

    /* =========================================
       SERIES EPISODES MODAL
       ========================================= */
    #series-modal {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.88);
      z-index: 1800;
      display: none;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      padding: 2.5rem 1rem;
    }

    #series-modal.open {
      display: flex;
    }

    .series-dialog {
      width: 100%;
      max-width: 880px;
      background-color: #181818;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.95);
      border: 1px solid rgba(255,255,255,0.12);
      position: relative;
      margin: auto;
    }

    .series-banner {
      position: relative;
      height: 280px;
      background: linear-gradient(135deg, #2b2b2b 0%, #141414 100%);
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 2rem;
    }

    .series-banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, #181818 5%, rgba(24,24,24,0.35) 65%, rgba(0,0,0,0.5) 100%);
    }

    .series-close-btn {
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      z-index: 5;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .series-close-btn:hover {
      background: var(--netflix-red);
      border-color: var(--netflix-red);
    }

    .series-header-info {
      position: relative;
      z-index: 3;
    }

    /* =========================================
       DRIVE FILE & THUMBNAIL RESOLUTION
       ========================================= */
    function getDriveThumbUrl(fileId, width = 800) {
      if (!fileId) return '';
      return `https://drive.google.com/thumbnail?id=${fileId}&sz=w${width}`;
    }

    function resolveFileIdWithFallback(driveIndex, baseNameLower, preferredExt, fallbackExts) {
      if (preferredExt) {
        const cleanPref = preferredExt.replace(/^\./, '').toLowerCase();
        const exactMatch = driveIndex[`${baseNameLower}.${cleanPref}`];
        if (exactMatch) return exactMatch;
      }
      for (const ext of fallbackExts) {
        const found = driveIndex[`${baseNameLower}.${ext}`];
        if (found) return found;
      }
      return driveIndex[baseNameLower] || null;
    }

    /* =========================================
       CSV PARSER & SERIES GROUPING
       ========================================= */
    function parseContentCsvToCatalog(csvText, driveIndex) {
      if (!csvText) return [];
      const items = [];
      const seriesMap = new Map();
      const lines = csvText.split(/\r?\n/);

      for (let rawLine of lines) {
        const line = rawLine.trim();
        if (!line || line.startsWith('#')) continue;

        const cols = [];
        let current = '';
        let inQuotes = false;
        let inBrackets = false;

        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            inQuotes = !inQuotes;
          } else if (ch === '[' && !inQuotes) {
            inBrackets = true;
            current += ch;
          } else if (ch === ']' && !inQuotes) {
            inBrackets = false;
            current += ch;
          } else if (ch === ',' && !inQuotes && !inBrackets) {
            cols.push(current.trim());
            current = '';
          } else {
            current += ch;
          }
        }
        cols.push(current.trim());

        const title = (cols[0] || '').replace(/^"|"$/g, '').trim();
        if (!title) continue;

        const subtitle = (cols[1] || '').replace(/^"|"$/g, '').trim();
        const rawTags = (cols[2] || '').replace(/^\[|\]$/g, '').trim();
        const tags = rawTags
          ? rawTags.split(',').map(t => t.trim()).filter(Boolean)
          : [];

        const videoExt = (cols[3] || '').replace(/^\./, '').trim();
        const thumbExt = (cols[4] || '').replace(/^\./, '').trim();
        const seriesName = (cols[5] || '').replace(/^"|"$/g, '').trim();

        const titleLower = title.toLowerCase();

        const videoFileId = resolveFileIdWithFallback(driveIndex, titleLower, videoExt, ['mp4', 'mov', 'm4v', 'webm']);
        const thumbFileId = resolveFileIdWithFallback(driveIndex, titleLower, thumbExt, ['jpg', 'jpeg', 'png', 'webp']);

        const clipObj = {
          title,
          subtitle,
          tags,
          seriesName,
          videoFileId,
          thumbFileId
        };

        if (!seriesName) {
          items.push({
            type: 'single',
            title: clipObj.title,
            subtitle: clipObj.subtitle,
            tags: clipObj.tags,
            thumbFileId: clipObj.thumbFileId,
            clip: clipObj
          });
        } else {
          const seriesKey = seriesName.toLowerCase();
          if (!seriesMap.has(seriesKey)) {
            const dedicatedCoverId = resolveFileIdWithFallback(driveIndex, seriesKey, '', ['jpg', 'jpeg', 'png', 'webp']);
            const seriesItem = {
              type: 'series',
              title: seriesName,
              tags: [...clipObj.tags],
              thumbFileId: dedicatedCoverId || clipObj.thumbFileId,
              episodes: [clipObj]
            };
            seriesMap.set(seriesKey, seriesItem);
            items.push(seriesItem);
          } else {
            const existingSeries = seriesMap.get(seriesKey);
            existingSeries.episodes.push(clipObj);
            if (!existingSeries.thumbFileId && clipObj.thumbFileId) {
              existingSeries.thumbFileId = clipObj.thumbFileId;
            }
            clipObj.tags.forEach(t => {
              if (!existingSeries.tags.includes(t)) {
                existingSeries.tags.push(t);
              }
            });
          }
        }
      }

      return items;
    }

    function extractDriveId(url) {
      if (!url) return null;
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    }

    function resolveAssetUrl(src, driveIndex, width = 1600) {
      if (!src) return '';
      const trimmed = src.trim();
      const driveIdFromUrl = extractDriveId(trimmed);
      if (driveIdFromUrl) {
        return getDriveThumbUrl(driveIdFromUrl, width);
      }
      if (trimmed.startsWith('http')) {
        return trimmed;
      }
      const cleanName = trimmed.replace(/^\.?\//, '').toLowerCase();
      if (driveIndex[cleanName]) {
        return getDriveThumbUrl(driveIndex[cleanName], width);
      }
      const baseWithoutExt = cleanName.replace(/\.[^.]+$/, '');
      const fallbackId = resolveFileIdWithFallback(driveIndex, baseWithoutExt, '', ['jpg', 'jpeg', 'png', 'webp']);
      if (fallbackId) {
        return getDriveThumbUrl(fallbackId, width);
      }
      return trimmed;
    }

    function getCache() {
      for (const key of LEGACY_CACHE_KEYS) {
        try {
          const raw = localStorage.getItem(key);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.csv) return parsed;
          }
        } catch (_) {}
      }
      return null;
    }

    function saveCache(data) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
      } catch (_) {}
    }

    function updateNavbarProfileBadge() {
      const prof = resolvedProfiles[activeProfileIndex] || resolvedProfiles[0];
      if (!prof) return;

      const slot = document.getElementById('nav-avatar-slot');
      const nameEl = document.getElementById('nav-profile-name');
      if (nameEl) nameEl.textContent = prof.name;

      if (slot) {
        slot.innerHTML = prof.resolvedAvatarUrl
          ? `<img class="nav-avatar-thumb" src="${prof.resolvedAvatarUrl}" alt="${prof.name}" />`
          : `<div class="nav-avatar-default">
               <svg viewBox="0 0 100 100" width="20" height="20" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round">
                 <circle cx="35" cy="38" r="4" fill="#ffffff" stroke="none" />
                 <circle cx="65" cy="38" r="4" fill="#ffffff" stroke="none" />
                 <path d="M 30 62 Q 50 78 70 62" />
               </svg>
             </div>`;
      }
    }

    function applyState(profilesData, csvText, driveIndex) {
      const hero = { ...DEFAULT_HERO, ...(profilesData && profilesData.hero ? profilesData.hero : {}) };

      const rawProfiles = (profilesData && Array.isArray(profilesData.profiles) && profilesData.profiles.length > 0)
        ? profilesData.profiles
        : [
            { name: hero.profileName || "Moran", avatar: hero.profileAvatar || "moran.jpg" },
            { name: "Guest", avatar: "" }
          ];

      resolvedProfiles = rawProfiles.map(prof => ({
        name: prof.name,
        resolvedAvatarUrl: prof.avatar ? resolveAssetUrl(prof.avatar, driveIndex, 600) : ''
      }));

      if (!resolvedProfiles[activeProfileIndex]) {
        const guestIdx = resolvedProfiles.findIndex(p => p.name.trim().toLowerCase() !== "moran");
        activeProfileIndex = guestIdx >= 0 ? guestIdx : 0;
      }

      const gridEl = document.getElementById('profiles-grid');
      if (gridEl) {
        gridEl.innerHTML = resolvedProfiles.map((prof, idx) => {
          const isMoran = prof.name.trim().toLowerCase() === "moran";
          const lockBadge = isMoran ? `<span class="profile-lock-icon">🔒</span>` : '';
          const avatarHtml = prof.resolvedAvatarUrl
            ? `<img class="profile-avatar" src="${prof.resolvedAvatarUrl}" alt="${prof.name}" />`
            : `<div class="default-avatar-box">
                 <svg viewBox="0 0 100 100" width="95" height="95" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round">
                   <circle cx="35" cy="38" r="4" fill="#ffffff" stroke="none" />
                   <circle cx="65" cy="38" r="4" fill="#ffffff" stroke="none" />
                   <path d="M 30 62 Q 50 78 70 62" />
                 </svg>
               </div>`;

          return `
            <div class="profile-card" onclick="handleProfileSelect(${idx})">
              ${avatarHtml}
              <span class="profile-name">${prof.name} ${lockBadge}</span>
            </div>
          `;
        }).join('');
      }

      updateNavbarProfileBadge();

      document.getElementById('hero-section').style.backgroundImage = `url('${resolveAssetUrl(hero.bannerImage, driveIndex, 1600)}')`;
      document.getElementById('hero-badge').textContent = hero.badge;
      document.getElementById('hero-title').textContent = hero.title;
      document.getElementById('hero-meta').textContent = hero.meta;
      document.getElementById('hero-desc').textContent = hero.description;

      if (csvText) {
        catalogItems = parseContentCsvToCatalog(csvText, driveIndex);
        buildNavTags();
        renderRows(currentFilterTag);
      }
    }

    async function init() {
      const cached = getCache();
      if (cached) {
        const cachedIndex = { ...BUILTIN_DRIVE_INDEX, ...(cached.index || {}) };
        applyState(cached.profiles, cached.csv, cachedIndex);
      }

      try {
        const res = await fetch(`${APPS_SCRIPT_URL}?t=${Date.now()}`);
        if (!res.ok) throw new Error(`Apps Script HTTP ${res.status}`);
        const payload = await res.json();

        const rawIndex = payload.index ? payload.index : payload;
        const mergedIndex = { ...BUILTIN_DRIVE_INDEX, ...rawIndex };
        const profilesData = payload.profiles || (cached && cached.profiles) || null;
        const csvText = payload.csv || (cached && cached.csv) || null;

        if (csvText) {
          saveCache({ index: mergedIndex, profiles: profilesData, csv: csvText });
        }
        applyState(profilesData, csvText, mergedIndex);

        if (!csvText) {
          document.getElementById('rows-container').innerHTML =
            `<div style="padding: 2rem 4%; color: #e50914; background: rgba(0,0,0,0.7); border-radius: 8px; margin: 0 4%;">
              <h3>content.csv not found in Drive</h3>
              <p style="color: #ccc; margin-top: 0.5rem;">Make sure <code>content.csv</code> is uploaded inside <code>AppData</code> in Google Drive and that your Apps Script deployment was updated to a New Version.</p>
            </div>`;
        }
      } catch (err) {
        console.error('Error syncing with Google Drive:', err);
        if (!cached) {
          document.getElementById('rows-container').innerHTML =
            `<div style="padding: 2rem 4%; color: #e50914; background: rgba(0,0,0,0.7); border-radius: 8px; margin: 0 4%;">
              <h3>Error connecting to Google Drive AppData</h3>
              <p style="color: #888; font-size: 0.85rem; margin-top: 0.5rem;">Details: ${err.message}</p>
            </div>`;
        }
      }
    }

    function getAllUniqueTags() {
      const tagSet = new Set();
      catalogItems.forEach(item => (item.tags || []).forEach(t => tagSet.add(t)));
      return Array.from(tagSet);
    }

    function buildNavTags() {
      const nav = document.getElementById('nav-tags');
      const tags = getAllUniqueTags();
      nav.innerHTML = `<button class="nav-tag-btn ${currentFilterTag === 'ALL' ? 'active' : ''}" data-tag="ALL" onclick="filterByTag('ALL')">All</button>`;
      tags.forEach(tag => {
        const activeClass = currentFilterTag === tag ? 'active' : '';
        nav.innerHTML += `<button class="nav-tag-btn ${activeClass}" data-tag="${tag}" onclick="filterByTag('${tag}')">${tag}</button>`;
      });
    }

    function filterByTag(selectedTag) {
      currentFilterTag = selectedTag;
      document.querySelectorAll('.nav-tag-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tag === selectedTag);
      });
      renderRows(selectedTag);
    }

    function scrollRow(btn, direction) {
      const scroller = btn.parentElement.querySelector('.row-scroller');
      if (!scroller) return;
      const scrollAmount = scroller.clientWidth * 0.78;
      scroller.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }

    function buildImgTag(fileId, altText, width, extraClass = '') {
      if (!fileId) return '';
      const primaryUrl = getDriveThumbUrl(fileId, width);
      const fallbackUrl = `https://lh3.googleusercontent.com/d/${fileId}=w${width}`;
      const classAttr = extraClass ? `class="${extraClass}"` : '';
      return `<img ${classAttr} src="${primaryUrl}" alt="${altText}" loading="lazy" onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='${fallbackUrl}';}else{this.remove();}" />`;
    }

    function renderRows(filterTag) {
      const container = document.getElementById('rows-container');
      container.innerHTML = '';

      const moranAccess = isMoranUnlocked();
      const isSingleCategory = filterTag !== 'ALL';
      const tagsToRender = isSingleCategory ? [filterTag] : getAllUniqueTags();

      if (tagsToRender.length === 0 && catalogItems.length > 0) {
        tagsToRender.push('All Wishes');
      }

      tagsToRender.forEach(tag => {
        const matchingItems = catalogItems
          .map((item, index) => ({ ...item, originalIndex: index }))
          .filter(item => {
            if (tag === 'All Wishes') return true;
            const itemTags = item.tags || [];
            if (!isSingleCategory) {
              return itemTags[0] === tag;
            }
            return itemTags.includes(tag);
          });

        if (matchingItems.length === 0) return;

        const isHiddenGemsRow = tag.trim().toLowerCase() === "hidden gems";
        const rowLockIcon = (isHiddenGemsRow && !moranAccess) ? ' <span style="font-size:1rem;">🔒</span>' : '';

        const rowEl = document.createElement('section');
        rowEl.className = 'row';

        const cardsHtml = matchingItems.map(item => {
          const tagsText = (item.tags || []).join(' • ');
          const isLocked = isHiddenGemItem(item) && !moranAccess;
          const isSeries = item.type === 'series';

          const imgHtml = isLocked
            ? ''
            : buildImgTag(item.thumbFileId, item.title, 800, 'clip-thumb');

          const badgeHtml = isSeries
            ? `<div class="series-badge">Series • ${item.episodes.length} Episodes</div>`
            : '';

          const lockedPillHtml = isLocked
            ? `<div class="locked-pill">🔒 Moran Only</div>`
            : '';

          const subText = isLocked
            ? 'Locked • Moran Only'
            : (isSeries ? `${item.episodes.length} Episodes` : (item.subtitle || ''));

          const centerIcon = isLocked ? '🔒' : (isSeries ? '☰' : '▶');

          return `
            <div class="clip-card ${isLocked ? 'locked-card' : ''}" onclick="handleCardClick(${item.originalIndex})">
              ${badgeHtml}
              ${lockedPillHtml}
              ${imgHtml}
              <div class="play-icon-badge">${centerIcon}</div>
              <div class="clip-overlay">
                <div class="clip-title">${item.title}</div>
                <div class="clip-sub">${subText}</div>
                <div class="clip-tags">${tagsText}</div>
              </div>
            </div>
          `;
        }).join('');

        const scrollerClass = isSingleCategory ? 'row-scroller grid-view' : 'row-scroller';
        const arrowsHtml = isSingleCategory
          ? ''
          : `<button class="scroll-arrow left" onclick="scrollRow(this, -1)" aria-label="Scroll left">‹</button>
             <button class="scroll-arrow right" onclick="scrollRow(this, 1)" aria-label="Scroll right">›</button>`;

        rowEl.innerHTML = `
          <h2 class="row-title">${tag}${rowLockIcon}</h2>
          <div class="row-wrapper">
            ${arrowsHtml}
            <div class="${scrollerClass}">${cardsHtml}</div>
          </div>
        `;
        container.appendChild(rowEl);
      });
    }

    function handleCardClick(index) {
      const item = catalogItems[index];
      if (!item) return;

      if (isHiddenGemItem(item) && !isMoranUnlocked()) {
        openRestrictedModal();
        return;
      }

      if (item.type === 'series') {
        openSeriesModal(item);
      } else {
        const moranAccess = isMoranUnlocked();
        const standaloneQueue = catalogItems
          .filter(i => i.type === 'single' && (moranAccess || !isHiddenGemItem(i)))
          .map(i => i.clip);
        const queueIdx = standaloneQueue.findIndex(c => c.title === item.clip.title);
        openPlayerWithQueue(standaloneQueue, Math.max(0, queueIdx), false);
      }
    }

    /* =========================================
       SERIES MODAL FUNCTIONS
       ========================================= */
    function openSeriesModal(seriesItem) {
      if (isHiddenGemItem(seriesItem) && !isMoranUnlocked()) {
        openRestrictedModal();
        return;
      }

      document.getElementById('series-modal-title').textContent = seriesItem.title;
      document.getElementById('series-modal-meta').textContent =
        `${seriesItem.episodes.length} Episodes • ${(seriesItem.tags || []).join(' • ')}`;

      const bannerEl = document.getElementById('series-banner');
      if (seriesItem.thumbFileId) {
        bannerEl.style.backgroundImage = `url('${getDriveThumbUrl(seriesItem.thumbFileId, 1200)}')`;
      } else {
        bannerEl.style.backgroundImage = 'linear-gradient(135deg, #2b2b2b 0%, #141414 100%)';
      }

      const listEl = document.getElementById('episodes-list');
      listEl.innerHTML = seriesItem.episodes.map((ep, idx) => {
        const thumbHtml = buildImgTag(ep.thumbFileId, ep.title, 400);

        return `
          <div class="episode-row" onclick="playSeriesEpisode('${seriesItem.title.replace(/'/g, "\\'")}', ${idx})">
            <div class="episode-num">${idx + 1}</div>
            <div class="episode-thumb-box">
              ${thumbHtml}
              <div class="episode-play-mini">▶</div>
            </div>
            <div class="episode-details">
              <div class="episode-title">${ep.title}</div>
              <div class="episode-sub">${ep.subtitle || `Episode ${idx + 1}`}</div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('series-modal').classList.add('open');
    }

    function closeSeriesModal() {
      document.getElementById('series-modal').classList.remove('open');
    }

    function playSeriesEpisode(seriesTitle, epIndex) {
      const seriesItem = catalogItems.find(i => i.type === 'series' && i.title === seriesTitle);
      if (!seriesItem) return;
      if (isHiddenGemItem(seriesItem) && !isMoranUnlocked()) {
        openRestrictedModal();
        return;
      }
      openPlayerWithQueue(seriesItem.episodes, epIndex, true);
    }

    /* =========================================
       VIDEO PLAYER MODAL FUNCTIONS
       ========================================= */
    function openPlayerWithQueue(queue, startIndex, isSeriesPlayback) {
      if (!queue || queue.length === 0) return;
      activePlaylist = queue;
      activeQueueIndex = startIndex;

      const nextBtn = document.getElementById('next-clip-btn');
      nextBtn.textContent = isSeriesPlayback ? 'Next Episode ⏭' : 'Next Clip ⏭';

      loadActiveClip();
      document.getElementById('player-modal').classList.add('open');
    }

    function loadActiveClip() {
      const clip = activePlaylist[activeQueueIndex];
      if (!clip) return;

      const prefix = clip.seriesName ? `${clip.seriesName} • ` : '';
      document.getElementById('modal-title').textContent = prefix + clip.title;
      document.getElementById('modal-subtitle').textContent = clip.subtitle || '';

      pendingEmbedUrl = clip.videoFileId
        ? `https://drive.google.com/file/d/${clip.videoFileId}/preview?autoplay=1`
        : DRIVE_ROOT_FOLDER;

      const posterOverlay = document.getElementById('player-poster-overlay');
      const posterImg = document.getElementById('player-poster-img');
      const videoFrame = document.getElementById('video-frame');

      videoFrame.src = '';

      if (clip.thumbFileId) {
        posterImg.dataset.fb = '';
        posterImg.src = getDriveThumbUrl(clip.thumbFileId, 1280);
        posterImg.alt = clip.title;
        posterImg.onerror = () => {
          if (!posterImg.dataset.fb) {
            posterImg.dataset.fb = '1';
            posterImg.src = `https://lh3.googleusercontent.com/d/${clip.thumbFileId}=w1280`;
          } else {
            startVideoPlayback();
          }
        };
        posterOverlay.classList.add('visible');
      } else {
        startVideoPlayback();
      }
    }

    function startVideoPlayback() {
      document.getElementById('player-poster-overlay').classList.remove('visible');
      document.getElementById('video-frame').src = pendingEmbedUrl;
    }

    function closePlayerModal() {
      document.getElementById('player-modal').classList.remove('open');
      document.getElementById('player-poster-overlay').classList.remove('visible');
      document.getElementById('video-frame').src = '';
      pendingEmbedUrl = '';
    }

    function playFirstItem() {
      if (catalogItems.length > 0) {
        handleCardClick(0);
      }
    }

    function playNextInQueue() {
      if (activePlaylist.length === 0) return;
      activeQueueIndex = (activeQueueIndex + 1) % activePlaylist.length;
      loadActiveClip();
    }

    function toggleFullscreen() {
      const elem = document.getElementById('iframe-container');
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    window.addEventListener('scroll', () => {
      document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 40);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (document.getElementById('pin-modal').classList.contains('open')) {
          closePinModal();
        } else if (document.getElementById('restricted-modal').classList.contains('open')) {
          closeRestrictedModal();
        } else if (document.getElementById('player-modal').classList.contains('open')) {
          closePlayerModal();
        } else if (document.getElementById('series-modal').classList.contains('open')) {
          closeSeriesModal();
        }
      }
      if ((e.key === 'Enter' || e.key === ' ') && document.getElementById('start-experience-btn').style.display !== 'none') {
        e.preventDefault();
        startIntro();
      }
    });

    init();
  </script>
</body>
</html>
